name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run checks
        run: make run-checks

      - name: Upload smoke report
        uses: actions/upload-artifact@v4
        with:
          name: procrustes-smoke-report
          path: .tmp/smoke
          if-no-files-found: error
